<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16121F"/>
      <stop offset="55%" stop-color="#0D0B12"/>
      <stop offset="100%" stop-color="#0A1210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="45%" stop-color="#C9A84C"/>
      <stop offset="75%" stop-color="#E8D48B"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="ghana" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="33.33%" stop-color="#CE1126"/>
      <stop offset="33.33%" stop-color="#FCD116"/>
      <stop offset="66.66%" stop-color="#FCD116"/>
      <stop offset="66.66%" stop-color="#006B3F"/>
      <stop offset="100%" stop-color="#006B3F"/>
    </linearGradient>
    <linearGradient id="capsuleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <linearGradient id="capsuleB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F3D2E"/>
      <stop offset="100%" stop-color="#1FA36B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C9A84C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Kente-inspired diagonal threads -->
  <g stroke="#C9A84C" stroke-width="0.6" opacity="0.07">
    <line x1="-40" y1="320" x2="320" y2="-40"/>
    <line x1="40" y1="360" x2="400" y2="-40"/>
    <line x1="160" y1="360" x2="520" y2="-40"/>
    <line x1="760" y1="360" x2="1120" y2="-40"/>
    <line x1="880" y1="360" x2="1240" y2="-40"/>
    <line x1="1000" y1="360" x2="1360" y2="-40"/>
  </g>

  <!-- Pulse / ECG line -->
  <path d="M 0 236 H 330 L 356 236 L 372 196 L 392 268 L 408 216 L 420 236 H 640 L 664 236 L 678 206 L 696 258 L 712 222 L 724 236 H 1200"
        fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.5" filter="url(#soft)"/>

  <!-- Right-side emblem -->
  <g transform="translate(975, 140)">
    <circle cx="0" cy="0" r="130" fill="url(#halo)"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="0" cy="0" r="98" fill="none" stroke="#E8D48B" stroke-opacity="0.7" stroke-width="2"
            stroke-dasharray="80 536" stroke-linecap="round" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#C9A84C" stroke-opacity="0.14" stroke-width="1"/>

    <!-- Medical cross -->
    <g filter="url(#soft)" fill="url(#gold)">
      <rect x="-13" y="-38" width="26" height="76" rx="6"/>
      <rect x="-38" y="-13" width="76" height="26" rx="6"/>
    </g>

    <!-- Orbiting capsule (gold) -->
    <g transform="translate(98, 0) rotate(35)">
      <rect x="-22" y="-10" width="44" height="20" rx="10" fill="url(#capsuleA)" opacity="0.95"/>
      <line x1="0" y1="-9" x2="0" y2="9" stroke="#0D0B12" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- Orbiting capsule (green) -->
    <g transform="translate(-78, 61) rotate(-25)">
      <rect x="-19" y="-9" width="38" height="18" rx="9" fill="url(#capsuleB)" opacity="0.95" stroke="#1FA36B" stroke-opacity="0.6"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#0D0B12" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- Small tablet -->
    <circle cx="-30" cy="-95" r="9" fill="#0D0B12" stroke="url(#gold)" stroke-width="2"/>
    <line x1="-37" y1="-95" x2="-23" y2="-95" stroke="url(#gold)" stroke-width="1.6"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">
    <text x="72" y="128" font-size="68" fill="url(#gold)" letter-spacing="1">PozosPharma</text>
  </g>
  <text x="74" y="170" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#D8D2E4">
    Ghana's AI-powered pharmaceutical community
  </text>
  <text x="74" y="202" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="14.5" fill="#8E87A0" letter-spacing="0.4">
    Instant drug guidance  &#183;  Verified pharmacists  &#183;  Learning academy  &#183;  Pharmacy tools
  </text>

  <!-- Ghana stripe -->
  <rect x="74" y="226" width="150" height="5" rx="2.5" fill="url(#ghana)" opacity="0.85"/>

  <!-- Pill chips -->
  <g font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="#C9A84C">
    <rect x="74" y="252" width="118" height="28" rx="14" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-opacity="0.4"/>
    <text x="133" y="270" text-anchor="middle">AI Pharmacist</text>
    <rect x="204" y="252" width="128" height="28" rx="14" fill="#C9A84C" fill-opacity="0.08" stroke="#C9A84C" stroke-opacity="0.4"/>
    <text x="268" y="270" text-anchor="middle">Human Handoff</text>
    <rect x="344" y="252" width="118" height="28" rx="14" fill="#1FA36B" fill-opacity="0.08" stroke="#1FA36B" stroke-opacity="0.45"/>
    <text x="403" y="270" text-anchor="middle" fill="#4CC98F">Drug Safety</text>
  </g>
</svg>
