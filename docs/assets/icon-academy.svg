<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="198" height="198" rx="28" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="58" fill="url(#halo)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#C9A84C" stroke-opacity="0.18"/>

  <!-- graduation cap -->
  <polygon points="100,52 152,74 100,96 48,74" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 74 84 V 104 C 74 112 126 112 126 104 V 84 L 100 96 Z" fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round"/>
  <line x1="152" y1="74" x2="152" y2="100" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="152" cy="106" r="4.5" fill="url(#gold)"/>

  <!-- open book hint -->
  <path d="M 84 122 C 92 118 108 118 116 122" fill="none" stroke="#E8D48B" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9A93AE">Learning Academy</text>
</svg>
