<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="198" height="198" rx="28" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="58" fill="url(#halo)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#C9A84C" stroke-opacity="0.18"/>

  <!-- database cylinder -->
  <g stroke="url(#gold)" stroke-width="2.6" fill="none">
    <ellipse cx="88" cy="66" rx="30" ry="10"/>
    <path d="M 58 66 V 116 C 58 121.5 71.4 126 88 126 C 104.6 126 118 121.5 118 116 V 66"/>
    <path d="M 58 83 C 58 88.5 71.4 93 88 93 C 104.6 93 118 88.5 118 83" opacity="0.6"/>
    <path d="M 58 100 C 58 105.5 71.4 110 88 110 C 104.6 110 118 105.5 118 100" opacity="0.6"/>
  </g>

  <!-- capsule -->
  <g transform="translate(136, 116) rotate(-35)">
    <rect x="-24" y="-11" width="48" height="22" rx="11" fill="url(#cap)"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#0D0B12" stroke-width="2.4" opacity="0.55"/>
  </g>

  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9A93AE">Drug Database</text>
</svg>
