<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="198" height="198" rx="28" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="58" fill="url(#halo)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#C9A84C" stroke-opacity="0.18"/>

  <!-- map pin -->
  <path d="M 100 42 C 76 42 60 60 60 82 C 60 110 100 144 100 144 C 100 144 140 110 140 82 C 140 60 124 42 100 42 Z"
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- cross inside pin -->
  <g fill="url(#gold)">
    <rect x="95.5" y="62" width="9" height="34" rx="2.2"/>
    <rect x="83" y="74.5" width="34" height="9" rx="2.2"/>
  </g>

  <!-- ground ellipse -->
  <ellipse cx="100" cy="150" rx="26" ry="5" fill="none" stroke="#C9A84C" stroke-opacity="0.35" stroke-width="1.6"/>

  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9A93AE">Pharmacy Locator</text>
</svg>
