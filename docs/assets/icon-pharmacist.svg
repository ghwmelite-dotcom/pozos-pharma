<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="198" height="198" rx="28" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="58" fill="url(#halo)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#C9A84C" stroke-opacity="0.18"/>

  <!-- shield -->
  <path d="M 100 44 L 138 58 V 90 C 138 116 122 132 100 142 C 78 132 62 116 62 90 V 58 Z"
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- medical cross -->
  <g fill="url(#gold)">
    <rect x="95" y="68" width="10" height="42" rx="2.5"/>
    <rect x="79" y="84" width="42" height="10" rx="2.5"/>
  </g>

  <!-- verified check badge -->
  <circle cx="136" cy="128" r="13" fill="#0E1A15" stroke="#1FA36B" stroke-width="2.4"/>
  <path d="M 129.5 128 L 134 132.5 L 142.5 123.5" fill="none" stroke="#4CC98F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9A93AE">Verified Pharmacists</text>
</svg>
