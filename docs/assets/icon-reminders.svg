<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1728"/>
      <stop offset="100%" stop-color="#100D18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A8893A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#E8D48B"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1FA36B"/>
      <stop offset="100%" stop-color="#4CC98F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="198" height="198" rx="28" fill="url(#bg)" stroke="#C9A84C" stroke-opacity="0.22" stroke-width="1.5"/>
  <circle cx="100" cy="92" r="58" fill="url(#halo)"/>
  <circle cx="100" cy="92" r="52" fill="none" stroke="#C9A84C" stroke-opacity="0.18"/>

  <!-- clock -->
  <circle cx="94" cy="90" r="42" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="94" cy="90" r="3.5" fill="url(#gold)"/>
  <line x1="94" y1="90" x2="94" y2="62" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="90" x2="112" y2="99" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- tick marks -->
  <g stroke="#C9A84C" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="94" y1="52" x2="94" y2="57"/>
    <line x1="94" y1="123" x2="94" y2="128"/>
    <line x1="56" y1="90" x2="61" y2="90"/>
    <line x1="127" y1="90" x2="132" y2="90"/>
  </g>

  <!-- capsule dose -->
  <g transform="translate(142, 128) rotate(-30)">
    <rect x="-20" y="-9.5" width="40" height="19" rx="9.5" fill="url(#cap)"/>
    <line x1="0" y1="-8.5" x2="0" y2="8.5" stroke="#0D0B12" stroke-width="2.2" opacity="0.55"/>
  </g>

  <text x="100" y="172" text-anchor="middle" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9A93AE">Med Reminders</text>
</svg>
